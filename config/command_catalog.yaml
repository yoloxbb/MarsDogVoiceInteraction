# 产品交互词库的确定性事件路由。
# 附件共 116 条数据行（含表头共 117 行）。中文短语参与运行时精确匹配；
# 英文列仅保留为参考元数据，避免跨类别歧义直接触发。
version: "2026-08-29-expanded-v1"
source_name: "产品交互词库"
source_row_count: 116

# 每个中文标准词/句在启动时生成 10 个受控表述，生成结果仍进入哈希表做整句
